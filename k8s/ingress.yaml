apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alitelecom-ingress
  namespace: alitelecom
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      - path: /()(.*)
        pathType: Prefix
        backend:
          service:
            name: alitelecom-frontend-service
            port:
              number: 80
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: alitelecom-backend-service
            port:
              number: 5000
