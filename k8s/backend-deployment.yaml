apiVersion: apps/v1
kind: Deployment
metadata:
  name: alitelecom-backend
  namespace: alitelecom
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alitelecom-backend
  template:
    metadata:
      labels:
        app: alitelecom-backend
    spec:
      containers:
      - name: backend
        image: 466417121331.dkr.ecr.eu-west-3.amazonaws.com/alitelecom-backend:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: alitelecom-backend-service
  namespace: alitelecom
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: alitelecom-backend
